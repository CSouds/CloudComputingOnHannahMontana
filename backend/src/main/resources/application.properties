spring.application.name=backend

# Match local Compose defaults while allowing deployment connection settings to override them.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:filetransfer}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:filetransfer}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:local-development-only}}

# Find the versioned SQL files in the project's migrations folder.
spring.flyway.locations=classpath:db/migrations

# Browser origins allowed to read the device list: the Docker UI and the Vite dev server.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
